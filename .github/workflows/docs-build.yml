# The docs site (website/) on a pull request: built, never deployed. Broken links and anchors fail it
# (onBrokenLinks: throw). pages.yml deploys from main.
name: Docs site build

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: npm ci && docusaurus build
        working-directory: website
        run: |
          npm ci
          npx docusaurus build
