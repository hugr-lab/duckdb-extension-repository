name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-linux:
    # The store suite on PostgreSQL 17 and SQL Server 2022 (service containers), under -race.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: off
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kista-test
        ports: ["56432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Kista-Test-2026!
        ports: ["52433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Kista-Test-2026!' -Q 'SELECT 1'"
          --health-interval 5s --health-retries 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.1
      - name: test (all engines, race)
        env:
          KISTA_TEST_POSTGRES: postgres://postgres@127.0.0.1:56432/postgres?sslmode=disable
          KISTA_TEST_POSTGRES_PASSWORD: kista-test
          KISTA_TEST_SQLSERVER: sqlserver://sa@127.0.0.1:52433?encrypt=disable
          KISTA_TEST_SQLSERVER_PASSWORD: Kista-Test-2026!
          KISTA_TEST_REQUIRE_DBS: "1"
        run: go test -race ./...

  go-macos:
    # macOS runners cannot run service containers: SQLite only.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
