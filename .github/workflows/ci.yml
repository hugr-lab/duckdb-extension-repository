name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-linux:
    # The store suite on PostgreSQL 17 and SQL Server 2022 (service containers), Vault, OpenBao, an
    # S3-compatible server and Azurite, under -race.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: off
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kista-test
        ports: ["56432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Kista-Test-2026!
        ports: ["52433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Kista-Test-2026!' -Q 'SELECT 1'"
          --health-interval 5s --health-retries 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vault and OpenBao (dev mode)
        run: |
          # host.docker.internal: the PostgreSQL service as the database secrets engine reaches it (spec 0027)
          docker run -d --name vault -p 127.0.0.1:58200:8200 --add-host=host.docker.internal:host-gateway -e VAULT_DEV_ROOT_TOKEN_ID=root -e SKIP_SETCAP=true \
            hashicorp/vault:2.1.1 server -dev -dev-listen-address=0.0.0.0:8200
          docker run -d --name openbao -p 127.0.0.1:58210:8200 --add-host=host.docker.internal:host-gateway -e BAO_DEV_ROOT_TOKEN_ID=root -e SKIP_SETCAP=true \
            openbao/openbao:2.7.1 server -dev -dev-listen-address=0.0.0.0:8200
          for p in 58200 58210; do
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:$p/v1/sys/health >/dev/null && break; sleep 1; done
            curl -sf http://127.0.0.1:$p/v1/sys/health >/dev/null || { docker logs vault; docker logs openbao; exit 1; }
          done
      - name: S3-compatible server (SeaweedFS), Azurite, moto (AWS KMS) and fake-gcs-server
        run: make test-s3 test-azurite test-moto test-gcs
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: test (all engines, race)
        env:
          KISTA_TEST_POSTGRES: postgres://postgres@127.0.0.1:56432/postgres?sslmode=disable
          KISTA_TEST_POSTGRES_PASSWORD: kista-test
          KISTA_TEST_SQLSERVER: sqlserver://sa@127.0.0.1:52433?encrypt=disable
          KISTA_TEST_SQLSERVER_PASSWORD: Kista-Test-2026!
          KISTA_TEST_REQUIRE_DBS: "1"
          KISTA_TEST_VAULT: http://127.0.0.1:58200
          KISTA_TEST_VAULT_TOKEN: root
          KISTA_TEST_OPENBAO: http://127.0.0.1:58210
          KISTA_TEST_OPENBAO_TOKEN: root
          KISTA_TEST_REQUIRE_VAULT: "1"
          KISTA_TEST_VAULT_POSTGRES: host.docker.internal:56432
          KISTA_TEST_S3: http://kista-test:kista-test-secret@127.0.0.1:58333/kista-test
          KISTA_TEST_AZUREBLOB: http://127.0.0.1:50000/devstoreaccount1
          KISTA_TEST_REQUIRE_BLOB: "1"
          KISTA_TEST_MOTO: http://127.0.0.1:55000
          KISTA_TEST_GCS: http://127.0.0.1:54443
          KISTA_TEST_REQUIRE_MOTO: "1"
        # the api, store, release and upstream packages run every case on three engines under -race:
        # past go test's 10 minutes per package on a hosted runner
        run: go test -race -timeout 25m ./...

  console:
    # The administration console (spec 0015): types, unit tests, every shipped package's licence, the
    # audit, the build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run licenses
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  console-e2e:
    # The console end to end: Keycloak in Docker, kista serve with the console, Playwright (Chromium).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: make console
      - run: npx playwright install --with-deps chromium
        working-directory: web/console
      - run: make console-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: console-e2e-screenshots
          path: web/console/test-results/
          retention-days: 7

  go-macos:
    # macOS runners cannot run containers: SQLite and the fs blob store only.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  network:
    # spec 0009: real core and community files of a released DuckDB through the intake, and DuckDB's
    # own file through a passthrough channel. It depends on DuckDB's servers, so it does not block.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    env:
      GOWORK: off
      KISTA_TEST_NETWORK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run 'TestNetworkIntake|TestCommunitySyncNetwork' -v ./internal/upstream/ ./internal/reservedsync/

  reserved:
    # DuckDB's extension aliases and keys (spec 0009) are current for the pin (the reserved names are data: spec 0030).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make reserved
      - run: git diff --exit-code internal/reserved internal/upstream/duckdbkeys

  chart:
    # The Helm chart (spec 0013): lint, kubeconform and the refusals (deploy/helm/test.sh), and kista
    # loading each configuration the chart renders; with Helm 3 and Helm 4.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        helm:
          - {version: v3.22.0, sha256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb}
          - {version: v4.3.0, sha256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: helm and kubeconform
        env:
          HELM: ${{ matrix.helm.version }}
          HELM_SHA256: ${{ matrix.helm.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o helm.tgz "https://get.helm.sh/helm-$HELM-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tgz" | sha256sum -c
          tar -xzf helm.tgz -C bin --strip-components 1 linux-amd64/helm
          curl -fsSL --retry 3 -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kc.tgz" | sha256sum -c
          tar -xzf kc.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: helm version --short && deploy/helm/test.sh
      - run: go test -count=1 ./deploy/helm/chartcheck/
        env:
          KISTA_TEST_REQUIRE_HELM: "1"

  terraform:
    # The cloud recipes (spec 0020): formatted, valid, and their plans and refusals tested with mock
    # providers; no cloud, no credentials; the providers come from the committed lock file.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: terraform
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o tf.zip https://releases.hashicorp.com/terraform/1.16.6/terraform_1.16.6_linux_amd64.zip
          echo "38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7  tf.zip" | sha256sum -c
          unzip -q tf.zip terraform -d bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          for m in deploy/aws-ecs deploy/gcp-gke; do
            terraform -chdir="$m" fmt -check -recursive -diff
            terraform -chdir="$m" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$m" validate
            terraform -chdir="$m" test
          done

  bicep:
    # The Azure recipe (spec 0020): it builds, its parameters example too, and the linter is clean;
    # no cloud, no credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bicep
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/bicep" https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          echo "64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a  $RUNNER_TEMP/bin/bicep" | sha256sum -c
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          cd deploy/azure-container-apps
          bicep lint main.bicep --diagnostics-format sarif > lint.sarif
          jq -e '[.runs[].results[]] | length == 0' lint.sarif || { jq '.runs[].results[]' lint.sarif; exit 1; }
          bicep build main.bicep --stdout > /dev/null
          bicep build-params examples/trial.bicepparam --stdout > /dev/null
      - name: the Marketplace package, and Microsoft's certification checks on it (arm-ttk)
        run: |
          # with an attribution ID, as a release builds it
          KISTA_MARKETPLACE_PID=pid-00000000-0000-0000-0000-000000000000-partnercenter \
            deploy/azure-marketplace/build.sh "ghcr.io/hugr-lab/kista@sha256:$(printf '0%.0s' $(seq 64))" "$RUNNER_TEMP/app.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/arm-ttk.zip" https://github.com/Azure/arm-ttk/releases/download/20260213/arm-ttk.zip
          echo "2a2d21f17cc31299ba2c78caf97def3c1f9f37eb3a7bab7900cda18c95d4c657  $RUNNER_TEMP/arm-ttk.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/arm-ttk.zip" -d "$RUNNER_TEMP/arm-ttk"
          unzip -q "$RUNNER_TEMP/app.zip" -d "$RUNNER_TEMP/app"
          pwsh -NoProfile -Command '
            Import-Module "$env:RUNNER_TEMP/arm-ttk/arm-ttk/arm-ttk/arm-ttk.psd1"
            $r = Test-AzTemplate -TemplatePath "$env:RUNNER_TEMP/app"
            $bad = @($r | Where-Object { -not $_.Passed })
            $bad | ForEach-Object { $_.Name; $_.Errors | ForEach-Object { "  " + $_.Exception.Message } }
            "arm-ttk: $($r.Count) checks, $($bad.Count) failed"
            if ($bad.Count -gt 0 -or $r.Count -eq 0) { exit 1 }'
