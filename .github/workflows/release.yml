name: release

# A release (spec 0013), on a tag vX.Y.Z: the image ghcr.io/hugr-lab/kista:vX.Y.Z, the Helm chart
# oci://ghcr.io/hugr-lab/charts/kista X.Y.Z and the binaries for linux and darwin on the GitHub
# release, all signed (cosign, keyless) and attested. The build job holds no token that can push,
# sign or release, and uses no build cache; the jobs that do run no repository code. A version
# already in GHCR is never overwritten.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO: ghcr.io/hugr-lab/kista
  CHARTS: ghcr.io/hugr-lab/charts

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] ||
            { echo "not a release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag is on main
        # the signature names release.yml at the tag: a tag on another branch would sign that
        # branch's workflow and Dockerfile as a release
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "$GITHUB_SHA is not on main" >&2; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the image (linux/amd64, linux/arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --pull --no-cache --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" --sbom=true --provenance=false \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --output type=oci,dest=image,tar=false .
          jq -r '.manifests[0].digest' image/index.json
      - name: smoke test (amd64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64 --build-arg "VERSION=$VERSION" --provenance=false \
            --load -t kista:smoke .
          deploy/docker/smoke.sh kista:smoke "$VERSION"
      - name: build the binaries (linux, darwin; amd64, arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --target binary \
            --platform linux/amd64,linux/arm64,darwin/amd64,darwin/arm64 \
            --build-arg "VERSION=$VERSION" --provenance=false --output type=local,dest=out .
          mkdir dist
          for p in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            cp "out/$p/kista" "dist/kista-$VERSION-${p/_/-}"
          done
          chmod 0755 dist/kista-*
          (cd dist && sha256sum kista-* > SHA256SUMS && cat SHA256SUMS)
          "dist/kista-$VERSION-linux-amd64" version
      - name: helm
        run: |
          curl -fsSL --retry 3 -o helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tgz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components 1 linux-amd64/helm && rm helm.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: package the chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir chart
          helm lint --strict deploy/helm/kista -f deploy/helm/kind/values.yaml
          helm package deploy/helm/kista --version "${TAG#v}" --app-version "$TAG" -d chart
          ls -l chart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: chart/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      chart: ${{ steps.chart.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: chart
      - name: helm
        run: |
          curl -fsSL --retry 3 -o helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tgz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf helm.tgz -C "$RUNNER_TEMP/bin" --strip-components 1 linux-amd64/helm && rm helm.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: crane
        run: |
          curl -fsSL --retry 3 -o crane.tgz \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  crane.tgz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf crane.tgz -C "$RUNNER_TEMP/bin" crane && rm crane.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - id: push
        name: push :vX.Y.Z (never over an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | crane auth login ghcr.io -u "$ACTOR" --password-stdin
          digest=$(jq -r '.manifests[0].digest' image/index.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if out=$(crane digest "$REPO:$TAG" 2>&1); then
            # a re-run of this job after a failed signing: the same build is already there
            [ "$out" = "$digest" ] && exit 0
            echo "$REPO:$TAG already exists ($out): a version is never overwritten" >&2
            exit 1
          fi
          case "$out" in
            *MANIFEST_UNKNOWN*|*NAME_UNKNOWN*|*"404 Not Found"*) ;;
            *) echo "cannot tell whether $REPO:$TAG exists: $out" >&2; exit 1 ;;
          esac
          pushed=$(crane push image "$REPO:$TAG")
          [ "$pushed" = "$REPO@$digest" ] || { echo "pushed $pushed, built $digest" >&2; exit 1; }
      - id: chart
        name: push the chart to oci://ghcr.io/hugr-lab/charts (never over an existing version)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          tgz="chart/kista-${TAG#v}.tgz"
          layer="sha256:$(sha256sum "$tgz" | cut -d' ' -f1)"
          ref="$CHARTS/kista:${TAG#v}"
          if out=$(crane digest "$ref" 2>&1); then
            # a re-run after a failed signing: the same package is already there
            have=$(crane manifest "$ref" | jq -r '.layers[0].digest')
            [ "$have" = "$layer" ] || { echo "$ref already exists: a version is never overwritten" >&2; exit 1; }
            echo "digest=$out" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$out" in
            *MANIFEST_UNKNOWN*|*NAME_UNKNOWN*|*"404 Not Found"*) ;;
            *) echo "cannot tell whether $ref exists: $out" >&2; exit 1 ;;
          esac
          helm push "$tgz" "oci://$CHARTS"
          [ "$(crane manifest "$ref" | jq -r '.layers[0].digest')" = "$layer" ] || { echo "pushed another package" >&2; exit 1; }
          echo "digest=$(crane digest "$ref")" >> "$GITHUB_OUTPUT"
      - name: sign the image, the chart and the binaries
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes "$REPO@$DIGEST"
          cosign sign --yes "$CHARTS/kista@$CHART_DIGEST"
          for f in dist/kista-* dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHARTS }}/kista
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          CHART_DIGEST: ${{ needs.publish.outputs.chart }}
        run: |
          cat > notes.md <<EOF
          The image: \`$REPO:$TAG\`, digest \`$DIGEST\` (linux/amd64, linux/arm64). Deploy by digest.

          The chart: \`helm install kista oci://$CHARTS/kista --version ${TAG#v} --set image.digest=$DIGEST -f values.yaml\`
          (chart digest \`$CHART_DIGEST\`).

          Verify the image, the chart, and a binary with its \`.sigstore.json\` bundle:

          \`\`\`
          cosign verify $REPO@$DIGEST \\
            --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify $CHARTS/kista@$CHART_DIGEST \\
            --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob --bundle kista-$TAG-linux-amd64.sigstore.json \\
            --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com kista-$TAG-linux-amd64
          \`\`\`
          EOF
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "kista $TAG" \
            --notes-file notes.md --generate-notes "${pre[@]}" dist/*
