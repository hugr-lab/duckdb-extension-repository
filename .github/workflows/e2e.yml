name: e2e

# DuckDB at e2e/DUCKDB_PIN against signed repositories (spec 0002).
on:
  pull_request:
    paths: [internal/extfile/**, internal/signer/**, e2e/**, go.mod, Makefile, .github/workflows/e2e.yml]
  push:
    branches: [main]
    paths: [internal/extfile/**, internal/signer/**, e2e/**, go.mod, Makefile, .github/workflows/e2e.yml]
  workflow_dispatch:
    inputs:
      os:
        description: runner image
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ inputs.os || 'ubuntu-24.04' }}
    env:
      GOWORK: off
      E2E_BUILD: ${{ github.workspace }}/e2e/.build
      CCACHE_DIR: ${{ runner.temp }}/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build dependencies (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libssl-dev libcurl4-openssl-dev
      - name: build dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install ninja ccache openssl@3
      - name: cache keys
        id: key
        run: |
          pin=$(cat e2e/DUCKDB_PIN e2e/build-duckdb.sh | openssl dgst -sha256 | awk '{print substr($NF,1,16)}')
          cc=$(cc --version | head -1 | openssl dgst -sha256 | awk '{print substr($NF,1,8)}')
          echo "build=duckdb-e2e-${{ runner.os }}-${{ runner.arch }}-$pin-$cc" >> "$GITHUB_OUTPUT"
          echo "ccache=ccache-e2e-${{ runner.os }}-${{ runner.arch }}-$pin" >> "$GITHUB_OUTPUT"
      # Only the build output is cached (lib, include, extensions). It is saved right after the build,
      # so a failing test run does not throw a 30-45 minute build away.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build
        with:
          path: |
            e2e/.build/lib
            e2e/.build/include
            e2e/.build/extensions
          key: ${{ steps.key.outputs.build }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.key.outputs.ccache }}
      - name: build DuckDB at the pin
        if: steps.build.outputs.cache-hit != 'true'
        run: make e2e-duckdb
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.cache-hit != 'true'
        with:
          path: |
            e2e/.build/lib
            e2e/.build/include
            e2e/.build/extensions
          key: ${{ steps.key.outputs.build }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.key.outputs.ccache }}
      - run: make e2e-runner
      - run: make e2e
