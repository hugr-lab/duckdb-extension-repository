name: e2e

# DuckDB at e2e/DUCKDB_PIN against signed repositories (spec 0002): on any server code change, since
# the cases go through serving, tokens, publication and upstreams, not only the file format. Then the
# Helm chart on kind (spec 0013) when the chart, the image or the file rules change, and nightly. The
# C++ SDK (spec 0012; in hugr-lab/extension-ci-tools at e2e/CI_TOOLS_PIN, spec 0022) is built and
# tested against the same DuckDB build.
on:
  pull_request:
    paths: [internal/**, cmd/**, e2e/**, go.mod, go.sum, Makefile, Dockerfile, .dockerignore, deploy/helm/**, .github/workflows/e2e.yml]
  push:
    branches: [main]
    paths: [internal/**, cmd/**, e2e/**, go.mod, go.sum, Makefile, Dockerfile, .dockerignore, deploy/helm/**, .github/workflows/e2e.yml]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: runner image
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ inputs.os || 'ubuntu-24.04' }}
    outputs:
      build: ${{ steps.key.outputs.build }}
    env:
      GOWORK: off
      E2E_BUILD: ${{ github.workspace }}/e2e/.build
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build dependencies (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libssl-dev libcurl4-openssl-dev
      - name: build dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install ninja ccache openssl@3
      - name: cache keys
        id: key
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          # the build includes the SDK's test extension (kista_demo): a new extension-ci-tools pin rebuilds
          # it, ccache warm
          pin=$(cat e2e/DUCKDB_PIN e2e/CI_TOOLS_PIN e2e/build-duckdb.sh e2e/fetch-ci-tools.sh | openssl dgst -sha256 | awk '{print substr($NF,1,16)}')
          cc=$(cc --version | head -1 | openssl dgst -sha256 | awk '{print substr($NF,1,8)}')
          echo "build=duckdb-e2e-${{ runner.os }}-${{ runner.arch }}-$pin-$cc" >> "$GITHUB_OUTPUT"
          echo "ccache=ccache-e2e-${{ runner.os }}-${{ runner.arch }}-$pin" >> "$GITHUB_OUTPUT"
      # Only the build output is cached (lib, include, extensions, sdk, core-src). It is saved right after the build,
      # so a failing test run does not throw a 30-45 minute build away.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build
        with:
          path: |
            e2e/.build/lib
            e2e/.build/include
            e2e/.build/extensions
            e2e/.build/sdk
            e2e/.build/core-src
          key: ${{ steps.key.outputs.build }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.key.outputs.ccache }}
          # a changed build script keeps the pin's objects: an earlier cache is still warm
          restore-keys: ccache-e2e-${{ runner.os }}-${{ runner.arch }}-
      - name: build DuckDB at the pin
        if: steps.build.outputs.cache-hit != 'true'
        run: make e2e-duckdb
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.cache-hit != 'true'
        with:
          path: |
            e2e/.build/lib
            e2e/.build/include
            e2e/.build/extensions
            e2e/.build/sdk
            e2e/.build/core-src
          key: ${{ steps.key.outputs.build }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.key.outputs.ccache }}
      - run: make e2e-runner
      - name: the C++ SDK against the licence vectors
        run: make sdk-test
      - name: Vault and OpenBao (dev mode)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name vault -p 127.0.0.1:58200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=root -e SKIP_SETCAP=true \
            hashicorp/vault:2.1.1 server -dev -dev-listen-address=0.0.0.0:8200
          docker run -d --name openbao -p 127.0.0.1:58210:8200 -e BAO_DEV_ROOT_TOKEN_ID=root -e SKIP_SETCAP=true \
            openbao/openbao:2.7.1 server -dev -dev-listen-address=0.0.0.0:8200
          for p in 58200 58210; do
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:$p/v1/sys/health >/dev/null && break; sleep 1; done
            curl -sf http://127.0.0.1:$p/v1/sys/health >/dev/null || { docker logs vault; docker logs openbao; exit 1; }
          done
          {
            echo KISTA_TEST_VAULT=http://127.0.0.1:58200; echo KISTA_TEST_VAULT_TOKEN=root
            echo KISTA_TEST_OPENBAO=http://127.0.0.1:58210; echo KISTA_TEST_OPENBAO_TOKEN=root
            echo KISTA_TEST_REQUIRE_VAULT=1
          } >> "$GITHUB_ENV"
      - name: S3-compatible server (SeaweedFS) and Azurite
        if: runner.os == 'Linux'
        run: |
          make test-s3 test-azurite
          {
            echo KISTA_TEST_S3=http://kista-test:kista-test-secret@127.0.0.1:58333/kista-test
            echo KISTA_TEST_AZUREBLOB=http://127.0.0.1:50000/devstoreaccount1
            echo KISTA_TEST_REQUIRE_BLOB=1
          } >> "$GITHUB_ENV"
      - run: make e2e

  kind:
    # The Helm chart on kind (deploy/helm/kind/run.sh): two replicas behind Traefik with the
    # NetworkPolicy, PostgreSQL, S3 and OpenBao, DuckDB through the ingress, a rolling restart. On
    # changes to the chart, the image or the file rules; on main and nightly always.
    needs: e2e
    if: ${{ !inputs.os || inputs.os == 'ubuntu-24.04' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        name: what changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -E '^(deploy/helm/|Dockerfile$|\.dockerignore$|cmd/kista/|internal/(secretfile|egress|serve|config)/|e2e/remote_test\.go$|\.github/workflows/e2e\.yml$)' <<<"$changed" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changed.outputs.run
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changed.outputs.run
        with:
          path: |
            e2e/.build/lib
            e2e/.build/include
            e2e/.build/extensions
            e2e/.build/sdk
          key: ${{ needs.e2e.outputs.build }}
          fail-on-cache-miss: true
      - name: kind and helm
        if: steps.changed.outputs.run
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o bin/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  bin/kind" | sha256sum -c
          chmod +x bin/kind
          curl -fsSL --retry 3 -o helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tgz" | sha256sum -c
          tar -xzf helm.tgz -C bin --strip-components 1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: steps.changed.outputs.run
        run: |
          # DuckDB resolves kista.localhost itself; pin it to the address kind's ports listen on
          echo '127.0.0.1 kista.localhost' | sudo tee -a /etc/hosts >/dev/null
          make e2e-runner && deploy/helm/kind/run.sh
