name: image

# kista's image (spec 0013). A pull request builds both platforms and runs the amd64 build (the smoke
# test); main also pushes ghcr.io/hugr-lab/kista:edge and :sha-<commit>, signed and attested. The
# build job holds no token that can push or sign; the publish job runs no repository code.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPO: ghcr.io/hugr-lab/kista

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      short: ${{ steps.version.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: the version
        run: |
          short=${GITHUB_SHA::12}
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=edge-$short" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (linux/amd64, linux/arm64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build --pull --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" --sbom=true --provenance=false \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --output type=oci,dest=image,tar=false .
          jq -r '.manifests[0].digest' image/index.json
      - name: smoke test (amd64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build --platform linux/amd64 --build-arg "VERSION=$VERSION" --provenance=false \
            --load -t kista:smoke .
          deploy/docker/smoke.sh kista:smoke "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: image
          path: image/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image
      - name: crane
        run: |
          curl -fsSL --retry 3 -o crane.tgz \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  crane.tgz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf crane.tgz -C "$RUNNER_TEMP/bin" crane && rm crane.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - id: push
        name: push :sha-<commit> and :edge
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHORT: ${{ needs.build.outputs.short }}
        run: |
          echo "$GH_TOKEN" | crane auth login ghcr.io -u "$ACTOR" --password-stdin
          digest=$(jq -r '.manifests[0].digest' image/index.json)
          pushed=$(crane push image "$REPO:sha-$SHORT")
          [ "$pushed" = "$REPO@$digest" ] || { echo "pushed $pushed, built $digest" >&2; exit 1; }
          crane tag "$REPO@$digest" edge
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REPO@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
