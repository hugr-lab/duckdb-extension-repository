# want: gke.managedCertificate: Google-managed certificates take no wildcard host (*.example.com)
config:
  store:
    kind: sqlite
  serve:
    public_url: https://kista.example.com
    trusted_proxies: [35.191.0.0/16, 130.211.0.0/22]
gke:
  backendConfig:
    enabled: true
  managedCertificate:
    enabled: true
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: gce
  hosts: [{host: kista.example.com}, {host: "*.example.com"}]
networkPolicy:
  loadBalancerRanges: [35.191.0.0/16, 130.211.0.0/22]
