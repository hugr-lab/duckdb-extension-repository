# want: must be the mountPath of a secretVolumes entry
config:
  store: {kind: postgres, dsn: postgres://kista@db/kista}
  serve: {public_url: https://kista.example.com, trusted_proxies: [10.0.0.0/8]}
  blob: {domains: [{name: default, kind: s3, s3: {endpoint: https://s3.example.com, bucket: b, region: r, lookup: path, sse: none}}]}
  signers:
    sources:
      - {name: k8s, kind: kubesecret, allow: ["ext-"], kubesecret: {dir: /etc/kista/signing/prod, etcd_encryption_at_rest: true}}
networkPolicy: {ingressController: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}, podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}}}
secretVolumes: [{name: signing, secretName: kista-signing-prod, mountPath: /etc/kista/signing}]
