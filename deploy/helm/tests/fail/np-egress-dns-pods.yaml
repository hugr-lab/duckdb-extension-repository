# want: networkPolicy.egress.dns: a podSelector without matchLabels or matchExpressions
config:
  store: {kind: sqlite}
  serve: {public_url: https://kista.example.com, trusted_proxies: [10.0.0.0/8]}
networkPolicy:
  loadBalancerRanges: [10.1.0.0/16]
  egress: {enabled: true, dns: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-dns}}}}
