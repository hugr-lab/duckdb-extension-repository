# AKS: workload identity for the Entra database login, Key Vault keys and Azure Blob
azure:
  workloadIdentity:
    clientId: 11111111-1111-1111-1111-111111111111
config:
  store:
    kind: postgres
    dsn: postgres://kista@kista.postgres.database.azure.com:5432/kista?sslmode=verify-full
    login: {kind: entra}
  azure:
    identity: {kind: workload, client_id: 11111111-1111-1111-1111-111111111111, tenant_id: 22222222-2222-2222-2222-222222222222}
  serve:
    public_url: https://kista.example.com
    trusted_proxies: [10.244.0.0/16]
  blob:
    domains:
      - name: default
        kind: azureblob
        azureblob:
          account: kistablobs
          container: bodies
          identity: {kind: workload, client_id: 11111111-1111-1111-1111-111111111111, tenant_id: 22222222-2222-2222-2222-222222222222}
networkPolicy:
  ingressController:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
    podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
