{{- with .Values.gke.frontendConfig.sslPolicy }}
# the GKE Ingress's https: the SSL policy sets the TLS versions and ciphers
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ include "kista.fullname" $ }}
  namespace: {{ include "kista.namespace" $ }}
  labels: {{- include "kista.labels" $ | nindent 4 }}
spec:
  sslPolicy: {{ . | quote }}
{{- end }}
