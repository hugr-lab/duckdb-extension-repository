{{- if .Values.ingress.enabled }}
{{- if eq .Values.mode "tls" }}
{{- fail "ingress: mode tls terminates TLS in the pod; use the LoadBalancer Service or TLS passthrough" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kista.fullname" . }}
  namespace: {{ include "kista.namespace" $ }}
  labels: {{- include "kista.labels" . | nindent 4 }}
  {{- $ann := deepCopy (.Values.ingress.annotations | default dict) -}}
  {{- if .Values.gke.managedCertificate.enabled }}
  {{- $certs := list (include "kista.fullname" .) }}
  {{- with get $ann "networking.gke.io/managed-certificates" }}{{ $certs = prepend $certs . }}{{ end }}
  {{- $_ := set $ann "networking.gke.io/managed-certificates" (join "," $certs) }}
  {{- end }}
  {{- if .Values.gke.frontendConfig.sslPolicy }}
  {{- $_ := set $ann "networking.gke.io/v1beta1.FrontendConfig" (include "kista.fullname" .) }}
  {{- end }}
  {{- with $ann }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # an entry without host: every host (a load balancer reached by its address)
    {{- range .Values.ingress.hosts }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kista.fullname" $ }}
                port:
                  name: http
      {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
