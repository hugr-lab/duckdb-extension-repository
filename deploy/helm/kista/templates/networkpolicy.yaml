{{- $_ := include "kista.validate" . -}}
{{- if include "kista.networkPolicy" . }}
{{- $np := .Values.networkPolicy }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kista.fullname" . }}
  namespace: {{ include "kista.namespace" $ }}
  labels: {{- include "kista.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kista.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    # the serving port: the ingress controller and the load balancers only, so that trusting
    # their X-Forwarded-For (serve.trusted_proxies) trusts nobody else
    - ports:
        - port: 8443
          protocol: TCP
      from:
        {{- with $np.ingressController }}
        {{- if .podSelector }}
        # a podSelector alone: those pods in this namespace; with a namespaceSelector: in those
        - podSelector: {{- toYaml .podSelector | nindent 12 }}
          {{- with .namespaceSelector }}
          namespaceSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- range $np.loadBalancerRanges }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- $probe := concat $np.loadBalancerRanges $np.nodeCIDRs }}
    {{- if $probe }}
    # the health port: the load balancers' checks (the kubelet is exempt on mainstream CNIs)
    - ports:
        - port: 8081
          protocol: TCP
      from:
        {{- range $probe }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
