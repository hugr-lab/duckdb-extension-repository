{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kista.serviceAccountName" . }}
  labels: {{- include "kista.labels" . | nindent 4 }}
  {{- $ann := deepCopy (.Values.serviceAccount.annotations | default dict) }}
  {{- with .Values.azure.workloadIdentity.clientId }}
  {{- $_ := set $ann "azure.workload.identity/client-id" . }}
  {{- end }}
  {{- with .Values.aws.irsa.roleArn }}
  {{- $_ := set $ann "eks.amazonaws.com/role-arn" . }}
  {{- end }}
  {{- with .Values.gcp.serviceAccount }}
  {{- $_ := set $ann "iam.gke.io/gcp-service-account" . }}
  {{- end }}
  {{- with $ann }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# kista does not use the Kubernetes API; cloud webhooks add their own token volumes
automountServiceAccountToken: false
{{- end }}
