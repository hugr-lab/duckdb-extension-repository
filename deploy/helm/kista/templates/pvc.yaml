{{- if and (include "kista.sqlite" .) (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kista.name" (list . "data") }}
  namespace: {{ include "kista.namespace" $ }}
  labels: {{- include "kista.labels" . | nindent 4 }}
  annotations:
    # the database outlives an uninstall
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and .Values.blobVolume.enabled (not .Values.blobVolume.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kista.name" (list . "blobs") }}
  namespace: {{ include "kista.namespace" $ }}
  labels: {{- include "kista.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.blobVolume.accessMode }}]
  {{- with .Values.blobVolume.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.blobVolume.size }}
{{- end }}
