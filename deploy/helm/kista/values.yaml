# kista's Helm chart (spec 0013). The documentation:
# https://hugr-lab.github.io/duckdb-extension-repository/docs/deployment/kubernetes

image:
  repository: ghcr.io/hugr-lab/kista
  # default: the chart's appVersion
  tag: ""
  # sha256:…: deploy by digest (the release notes give it); wins over tag
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# kista's configuration file (kista.yaml), as YAML: see Configuration in the documentation. It goes
# into a ConfigMap at /etc/kista/kista.yaml; a change rolls the pods.
# - No secret values: kista refuses a password in a DSN or a token inline. Secrets are files from
#   secretVolumes (below), named here by their path.
# - Write sizes as strings with units (max_body: 1GiB): Helm turns large numbers into floats.
# - The chart writes, in what it renders:
#   - a health listener {addr: ":8081", scheme: health} for the probes (do not define one, and do
#     not use :8081);
#   - the serving listener on :8443, unless serve.listeners is set (it must then listen on :8443):
#     https behind_proxy (mode behind_proxy) or dual with the certificate from tlsSecret (mode tls);
#   - blob.spool_dir: /var/lib/kista/tmp/spool, on an emptyDir;
#   - with store.kind sqlite: store.sqlite.path /var/lib/kista/data/kista.db and, without
#     blob.domains, an fs domain at /var/lib/kista/data/blobs, both on the persistent volume.
# - serve.public_url is the base of the token audiences: the URL clients use.
# - serve.resign: turn it on only where this pod may sign (spec 0003).
# - store.migrate: auto (the default) migrates at start under the store's lock. A migration that
#   raises min_reader makes older pods unready at once; to avoid the short gap, set check and run
#   kista admin migrate first (Upgrading in the documentation).
config: {}

# true: every string in config holding "{{" is a template, rendered by tpl with the chart's root
# context (spec 0025), so a parent chart can write store.dsn: "host={{ .Values.global.db.host }} …".
# A template renders within its own string and cannot add keys. A literal "{{" is then written
# {{ "{{" }}. Off (the default), config is taken as written.
configTemplate: false

# The namespace of every object the chart makes; empty: the release's (spec 0024). An umbrella chart
# sets it to install kista in a namespace of its own. The chart creates no namespace.
namespaceOverride: ""

# behind_proxy: a TLS-terminating ingress or L7 load balancer in front, sending X-Forwarded-For and
# X-Forwarded-Proto; config.serve.trusted_proxies must name its addresses (in practice the pod
# CIDR, which the NetworkPolicy below narrows to the ingress controller's pods). The hop from the
# ingress to the pod is plain http and carries Bearer tokens.
# tls: kista terminates TLS itself on a dual listener (DuckDB's http bootstrap and https on one
# port), with the certificate from tlsSecret, behind an L4 load balancer or TLS passthrough.
mode: behind_proxy
# mode tls: a kubernetes.io/tls Secret (tls.crt, tls.key), mounted at /etc/kista/tls
tlsSecret: ""

# config.profile dev relaxes key and identity rules; the chart refuses it unless this is true
devProfile: false

# Ignored with store.kind sqlite (one replica). More than one needs blob domains every replica
# sees: s3, azureblob or gcs, or fs on blobVolume with ReadWriteMany.
replicas: 2

# Secrets, each mounted as a directory (mode 0440, group 65532), never with subPath: a rotated
# Secret reaches the pod. kista reads the database password, the Vault token, the S3 keys and the
# TLS files again when it uses them; the OTLP headers_file only at start.
#   - name: db
#     secretName: kista-db
#     mountPath: /etc/kista/secrets/db     # config: store.login.password_file: /etc/kista/secrets/db/password
secretVolumes: []

# Service account tokens for Vault or OpenBao jwt/kubernetes auth, or a GCP external_account file
# source. The audience must not be the API server's; expirationSeconds 600..3600.
#   - name: vault
#     mountPath: /var/run/secrets/kista/vault   # the file is <mountPath>/token
#     audience: vault
#     expirationSeconds: 3600
projectedTokens: []

# Extra environment: OTEL_* and the like, secret values through secretKeyRef. A KISTA_* variable
# overrides the setting it names (the store DSN, public_url); an unknown or file-only one stops
# kista. Configuration belongs in config.
env: []
envFrom: []

serviceAccount:
  create: true
  # default: the release's full name
  name: ""
  annotations: {}

# One identity per cloud. The chart writes the annotation (and label) and checks the config.
azure:
  workloadIdentity:
    # AKS workload identity: equal to every azure identity's client_id with kind workload in config
    clientId: ""
aws:
  irsa:
    # EKS IAM roles for service accounts: equal to every identity's role_arn with kind irsa in
    # config. EKS Pod Identity needs nothing here.
    roleArn: ""
gcp:
  # GKE Workload Identity: equal to the principal of every gcpkms source and gcs domain that uses
  # the metadata server (no credentials_file)
  serviceAccount: ""

# SQLite: the database and the fs blobs on one ReadWriteOnce volume of block storage (not Azure
# Files or NFS: SQLite's locking and WAL fail there).
persistence:
  size: 10Gi
  storageClass: ""
  existingClaim: ""

# An fs blob domain shared by the replicas, mounted at /var/lib/kista/blobs (the default domain's
# root): ReadWriteMany for more than one replica. Another mode means one pod at a time (Recreate,
# no adminJobs).
blobVolume:
  enabled: false
  size: 100Gi
  storageClass: ""
  accessMode: ReadWriteMany
  existingClaim: ""

# The spool emptyDir at /var/lib/kista/tmp. Empty: (2 × blob.max_ingests + 1) × blob.max_body. The
# pod requests as much ephemeral storage, unless resources.requests names it.
spool:
  sizeLimit: ""
  # Added to the size above, also to an explicit sizeLimit: disk for `kista admin bundle import`
  # run in the serving pod, which inflates one file at a time (about blob.max_body). A quantity
  # (bytes, Ki, Mi, Gi, Ti); with it, sizeLimit takes the same form.
  importHeadroom: 0

service:
  # default: ClusterIP with mode behind_proxy (port 80), LoadBalancer with mode tls (80 and 443)
  type: ""
  annotations: {}
  # mode tls: Local keeps the client addresses
  externalTrafficPolicy: Local
  loadBalancerSourceRanges: []

# mode behind_proxy. DuckDB follows no redirect: serve plain http on the hosts DuckDB uses, without
# an http→https redirect (Traefik does not redirect unless told to), so its http bootstrap works
# (spec 0006). AWS ALB with IP targets: alb.ingress.kubernetes.io/healthcheck-port:
# "8081" and alb.ingress.kubernetes.io/healthcheck-path: /readyz.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # - host: kista.example.com      (an entry without host: every host)
  hosts: []
  # - secretName: kista-tls
  #   hosts: [kista.example.com]
  tls: []

# GKE Ingress (NEG): a BackendConfig that checks /readyz on 8081, not the serving port.
gke:
  backendConfig:
    enabled: false
    # the load balancer's limit on a whole response (GKE's default is 30 seconds): above the time a
    # large publish or download takes. On a pod being replaced, serve.shutdown_timeout bounds
    # transfers still running, not this.
    timeoutSec: 600
    # a removed pod's requests in flight finish within this long (GKE's default is 0: cut at once)
    drainingTimeoutSec: 30
  # a Google-managed certificate for the Ingress's hosts, named on the Ingress. The hosts' DNS must
  # point at the load balancer before Google issues it (tens of minutes). A global static IP:
  # ingress.annotations kubernetes.io/ingress.global-static-ip-name.
  managedCertificate:
    enabled: false
  # a FrontendConfig naming a Compute Engine SSL policy for the Ingress's https: without one, GKE's
  # default accepts TLS 1.0 (gcloud compute ssl-policies create … --min-tls-version 1.2)
  frontendConfig:
    sslPolicy: ""

# Who may reach the pods. Default: on with mode behind_proxy (port 8443 only from the ingress
# controller's pods and loadBalancerRanges), off with mode tls. With it on, name the ingress
# controller's pods (or give loadBalancerRanges): its podSelector, and its namespaceSelector unless
# it runs in kista's namespace. For example Traefik's:
#   namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
#   podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
networkPolicy:
  enabled: null
  ingressController:
    namespaceSelector: {}
    podSelector: {}
  # load balancers that reach the pods directly, also for their health checks on 8081 (GKE:
  # 35.191.0.0/16, 130.211.0.0/22); put them in config.serve.trusted_proxies too
  loadBalancerRanges: []
  # for CNIs that do not exempt the kubelet's probes
  nodeCIDRs: []
  # What kista's pods may reach (spec 0025), apart from networkPolicy.enabled, which is ingress.
  # Off by default. On: a second NetworkPolicy on every pod of the release (the server and the
  # admin jobs) admits only DNS, public https, the private networks the config allows (egress.allow,
  # auth.server_egress_allow, upstreams.credentials[].allow, events.sinks[].allow, each with its
  # ports), the cloudMetadata endpoints and extraRules. The chart refuses it without a rule for a
  # PostgreSQL or SQL Server database, or without the metadata endpoint the config's identity uses.
  egress:
    enabled: false
    # UDP and TCP to the cluster's DNS pods. Both selectors empty: k8s-app: kube-dns in kube-system
    # (EKS, AKS, GKE, k3s, kind). A podSelector alone: those pods in kista's namespace; a
    # namespaceSelector alone is refused. OpenShift: namespaceSelector {matchLabels:
    # {kubernetes.io/metadata.name: openshift-dns}}, podSelector {matchLabels:
    # {dns.operator.openshift.io/daemonset-dns: default}}, ports [5353].
    # NodeLocal DNSCache (169.254.20.10): dns.enabled false and an extraRules entry.
    dns:
      enabled: true
      namespaceSelector: {}
      podSelector: {}
      ports: [53]
    # These ports on every public address: upstreams, issuers, cloud APIs and KMSs, public blob
    # stores. A cidr ending in /0 leaves out its family's ranges in except: the private and special
    # ranges kista's own egress refuses unless the config allows them (but ::ffff:0:0/96: an
    # IPv4-mapped address never goes on the wire, and a strict API server refuses it). Another cidr
    # is taken as written.
    public:
      enabled: true
      ports: [443]
      cidrs: [0.0.0.0/0, "::/0"]
      except:
        - 0.0.0.0/8
        - 10.0.0.0/8
        - 100.64.0.0/10
        - 127.0.0.0/8
        - 169.254.0.0/16
        - 172.16.0.0/12
        - 192.0.0.0/24
        - 192.0.2.0/24
        - 192.31.196.0/24
        - 192.52.193.0/24
        - 192.88.99.0/24
        - 192.168.0.0/16
        - 192.175.48.0/24
        - 198.18.0.0/15
        - 198.51.100.0/24
        - 203.0.113.0/24
        - 224.0.0.0/4
        - 240.0.0.0/4
        - 168.63.129.16/32
        - "::/128"
        - "::1/128"
        - "::ffff:0:0:0/96"
        - "64:ff9b:1::/48"
        - "100::/64"
        - "2001::/23"
        - "2001:db8::/32"
        - "2002::/16"
        - "3fff::/20"
        - "5f00::/16"
        - "fc00::/7"
        - "fe80::/10"
        - "fec0::/10"
        - "ff00::/8"
    # The metadata endpoints of the config's identity: gke (Workload Identity), aws-pod-identity
    # (EKS Pod Identity), imds (EC2's instance metadata, Azure's managed identity). IRSA and Azure
    # workload identity need none: they reach public endpoints on 443.
    cloudMetadata: []
    # NetworkPolicy egress rules, rendered as given: the database, a Vault or OpenBao, an OTel
    # collector, an in-cluster S3, a token service. For example:
    #   - to: [{ipBlock: {cidr: 10.20.0.5/32}}]
    #     ports: [{port: 5432, protocol: TCP}]
    #   - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openbao}},
    #           podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}}]
    #     ports: [{port: 8200, protocol: TCP}]
    extraRules: []

podDisruptionBudget:
  minAvailable: 1

# One CronJob per entry, running kista admin with the pods' config, Secrets and identity; suspended
# without a schedule. Refused with SQLite (run kubectl exec there).
#   - name: blob-verify
#     args: [blob, verify]
#     schedule: "0 3 * * 0"
adminJobs: []

probes:
  # the first start may migrate: this long before liveness applies
  startupSeconds: 300

# preStop sleeps this long (the endpoints update before the drain)
preStopSeconds: 5
# A rolling update waits this long after a new pod is ready before it removes an old one. GKE's NEG
# readiness gate can pass before the load balancer has checked the pod (measured on Autopilot: every
# backend unhealthy for seconds during a restart): 60 there.
minReadySeconds: 0
# empty: preStop + drain_timeout + 2 × shutdown_timeout + 21s + 10s (101 with the defaults)
terminationGracePeriodSeconds: null

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# by zone and by node, ScheduleAnyway
topologySpread: true
priorityClassName: ""
